name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      # TRINITY_VERSION (single line at the repo root) pins the ernie/trinity
      # release this build ships: every build job compiles the game module
      # libraries from that tag's source, and the release job bundles that
      # same release's pak assets byte-verbatim. One pin drives both; no job
      # may reference the "latest" trinity release.
      - name: Read Trinity pin
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < TRINITY_VERSION)"
          test -n "$v"
          echo "TRINITY_VERSION=$v" >> "$GITHUB_ENV"

      - name: Checkout Trinity source (pinned)
        uses: actions/checkout@v6
        with:
          repository: ernie/trinity
          ref: ${{ env.TRINITY_VERSION }}
          path: trinity

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.5.5
        with:
          vulkan_version: '1.4.350.0'
          cache: true
          stripdown: true

      - name: Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -DTRINITY_SOURCE_DIR="${{ github.workspace }}/trinity"
          cmake --build build --config Release

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msvc
          path: |
            build/Release/**/*.dll
            build/Release/**/trinityvr.exe
            build/Release/**/renderer_vulkan.dll
            build/Release/**/*.pk3
          if-no-files-found: error
          retention-days: 5

  windows-mingw:
    name: Windows MinGW
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      # TRINITY_VERSION pins the trinity release; see the windows-msvc job.
      - name: Read Trinity pin
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < TRINITY_VERSION)"
          test -n "$v"
          echo "TRINITY_VERSION=$v" >> "$GITHUB_ENV"

      - name: Checkout Trinity source (pinned)
        uses: actions/checkout@v6
        with:
          repository: ernie/trinity
          ref: ${{ env.TRINITY_VERSION }}
          path: trinity

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.5.5
        with:
          vulkan_version: '1.4.350.0'
          cache: true
          stripdown: true

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTRINITY_SOURCE_DIR="${{ github.workspace }}/trinity"
          cmake --build build

      - uses: actions/upload-artifact@v7
        with:
          name: windows-mingw
          path: |
            build/Release/**/*.dll
            build/Release/**/trinityvr.exe
            build/Release/**/renderer_vulkan.dll
            build/Release/**/*.pk3
          if-no-files-found: error
          retention-days: 5

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      # TRINITY_VERSION pins the trinity release; see the windows-msvc job.
      - name: Read Trinity pin
        run: |
          v="$(tr -d '[:space:]' < TRINITY_VERSION)"
          test -n "$v"
          echo "TRINITY_VERSION=$v" >> "$GITHUB_ENV"

      - name: Checkout Trinity source (pinned)
        uses: actions/checkout@v6
        with:
          repository: ernie/trinity
          ref: ${{ env.TRINITY_VERSION }}
          path: trinity

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libxcb-glx0-dev libgl-dev libxxf86vm-dev

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.5.5
        with:
          vulkan_version: '1.4.350.0'
          cache: false      # v1.5.x cache restore is broken on Linux
          stripdown: false  # appears to remove libvulkan.so on Linux

      # SDK 1.4.350 moved the loader out of $VULKAN_SDK/lib/, so CMake's
      # find_library(NAMES vulkan) misses it. Locate it and re-expose at the
      # expected path.
      - name: Ensure libvulkan.so symlink
        run: |
          find "$VULKAN_SDK" -name 'libvulkan*' -ls 2>/dev/null
          LIBVK=$(find "$VULKAN_SDK" -name 'libvulkan.so' -print -quit 2>/dev/null)
          [ -z "$LIBVK" ] && LIBVK=$(find "$VULKAN_SDK" -name 'libvulkan.so.1' -print -quit 2>/dev/null)
          if [ -n "$LIBVK" ] && [ ! -e "$VULKAN_SDK/lib/libvulkan.so" ]; then
            ln -sv "$LIBVK" "$VULKAN_SDK/lib/libvulkan.so"
          fi

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTRINITY_SOURCE_DIR="${{ github.workspace }}/trinity"
          cmake --build build

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            build/Release/**/*.so
            build/Release/**/trinityvr
            build/Release/**/renderer_vulkan.so
            build/Release/**/*.pk3
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [windows-msvc, windows-mingw, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            TRINITY_VERSION
            misc/update-trinity.bat
            misc/update-trinity.sh

      # Same pin the build jobs compiled the module libraries from: the paks
      # bundled below must come from that exact trinity release, byte-verbatim.
      - name: Read Trinity pin
        run: |
          v="$(tr -d '[:space:]' < TRINITY_VERSION)"
          test -n "$v"
          echo "TRINITY_VERSION=$v" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v8

      - name: Download Trinity assets (pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p trinity-assets
          gh release download "$TRINITY_VERSION" --repo ernie/trinity --pattern 'pak8t.pk3' --dir trinity-assets
          gh release download "$TRINITY_VERSION" --repo ernie/trinity --pattern 'pak3t.pk3' --dir trinity-assets
          gh release download "$TRINITY_VERSION" --repo ernie/trinity --pattern 'zzz-trinity-announcer.pk3' --dir trinity-assets

      - name: Bundle Trinity assets
        run: |
          for dir in windows-msvc windows-mingw linux; do
            if [ -d "$dir" ]; then
              echo "Bundling Trinity assets into $dir/"
              find "$dir" -type d -name baseq3 -exec cp trinity-assets/pak8t.pk3 {} \;
              find "$dir" -type d -name missionpack -exec cp trinity-assets/pak3t.pk3 {} \;
              find "$dir" -type d -name baseq3 -exec cp trinity-assets/zzz-trinity-announcer.pk3 {} \;
            fi
          done

      - name: Bundle update scripts
        run: |
          for dir in windows-msvc windows-mingw; do
            [ -d "$dir" ] && cp misc/update-trinity.bat "$dir/"
          done
          [ -d linux ] && cp misc/update-trinity.sh linux/

      # Transitional bridge: old q3vr installs match the q3vr-* asset and need a
      # q3vr-named exe in the payload so Sys_ApplyPendingUpdate replaces their
      # running exe and relaunches into the new code. Remove this step (and the
      # q3vr-* archive lines below) once the install base has migrated.
      - name: Create legacy-named binary copies (bridge)
        run: |
          for dir in windows-msvc windows-mingw; do
            if [ -d "$dir" ]; then
              find "$dir" -name trinityvr.exe -exec sh -c 'cp "$1" "$(dirname "$1")/q3vr.exe"' _ {} \;
            fi
          done
          if [ -d linux ]; then
            find linux -name trinityvr -exec sh -c 'cp "$1" "$(dirname "$1")/q3vr"' _ {} \;
          fi

      - name: Create archives
        run: |
          # Bridge (q3vr-*) archives include the legacy-named exe copies made above.
          7z a -r q3vr-windows-msvc-x86_64.zip    ./windows-msvc/*
          7z a -r q3vr-windows-mingw-x86_64.zip   ./windows-mingw/*
          7z a -r q3vr-linux-x86_64.zip           ./linux/*

          # Remove the legacy-named copies so the canonical (trinityvr-*) archives stay clean.
          find windows-msvc  -name 'q3vr.exe' -delete
          find windows-mingw -name 'q3vr.exe' -delete
          find linux         -name 'q3vr'     -delete

          7z a -r trinityvr-windows-msvc-x86_64.zip  ./windows-msvc/*
          7z a -r trinityvr-windows-mingw-x86_64.zip ./windows-mingw/*
          7z a -r trinityvr-linux-x86_64.zip         ./linux/*

      # Dry-run aid: on a manual run there is no tag, so no release is published
      # (see the gated step below). Expose the six archives as a downloadable
      # workflow artifact instead, so the bridge output can be inspected.
      - name: Upload archives for inspection (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: '*.zip'
          retention-days: 5

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
          body: |
            Trinity mod: ${{ env.TRINITY_VERSION }}

            Updating an existing install? Delete `baseq3/pakQ3VR.pk3`. Its
            contents ship in the Trinity mod paks now, and a stale copy
            overrides them.
          generate_release_notes: true
